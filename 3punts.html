<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor 3 Punts</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0c;
      --surface: #141414;
      --border: #252525;
      --accent: #b5a08a;
      --accent-dim: #7a6a55;
      --text: #e8e4dc;
      --text-dim: #777;
      --sold: #c0392b;
      --new: #27ae60;
      --reserved: #d4883a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 860px; margin: 0 auto; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 32px; margin-bottom: 40px; }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 6vw, 56px); font-weight: 700; letter-spacing: 2px; }
    .logo span { color: var(--accent); }
    .subtitle { font-size: 10px; color: var(--text-dim); letter-spacing: 4px; text-transform: uppercase; margin-top: 6px; }
    .nav-links { margin-top: 8px; display: flex; gap: 16px; }
    .nav-link { font-size: 11px; color: var(--accent); text-decoration: none; letter-spacing: 1px; }
    .nav-link:hover { color: #fff; }
    .status-bar { display: flex; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--new); animation: pulse 2s infinite; }
    .status-dot.loading { background: var(--accent); }
    .status-dot.error { background: var(--sold); animation: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-text { font-size: 11px; color: var(--text-dim); }
    .wake-btn { margin-left: auto; background: var(--accent); color: #000; border: none; padding: 10px 20px; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
    .wake-btn:hover { background: #fff; }
    .wake-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); padding: 24px; }
    .card-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; }
    .card-value { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 700; color: var(--accent); }
    .card-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .section { margin-bottom: 40px; }
    .section-title { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .cambio-item { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border); padding: 16px; margin-bottom: 8px; }
    .cambio-item.vendida { border-left-color: var(--sold); }
    .cambio-item.nueva { border-left-color: var(--new); }
    .cambio-item.nueva_vendida { border-left-color: var(--sold); }
    .cambio-item.precio_cambiado { border-left-color: var(--reserved); }
    .cambio-item.desaparecida { border-left-color: var(--reserved); }
    .cambio-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .cambio-artista { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 700; }
    .cambio-fecha { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
    .cambio-obra { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
    .badge { display: inline-block; font-size: 9px; padding: 2px 8px; margin-right: 6px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
    .badge.vendida { background: rgba(192,57,43,0.15); color: var(--sold); }
    .badge.nueva { background: rgba(39,174,96,0.15); color: var(--new); }
    .badge.nueva_vendida { background: rgba(192,57,43,0.15); color: var(--sold); }
    .badge.precio_cambiado { background: rgba(212,136,58,0.15); color: var(--reserved); }
    .badge.desaparecida { background: rgba(212,136,58,0.15); color: var(--reserved); }
    .cambio-precio { font-size: 13px; color: var(--accent); margin-top: 4px; }
    .historial-mes { margin-bottom: 16px; }
    .historial-mes-header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .historial-obra { display: flex; justify-content: space-between; padding: 8px 0 8px 16px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .empty { text-align: center; padding: 40px; color: var(--text-dim); font-size: 11px; }
    .loading-text { color: var(--text-dim); font-size: 11px; animation: blink 1.2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .last-update { font-size: 10px; color: var(--text-dim); text-align: right; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: #000; padding: 12px 20px; font-size: 11px; font-family: 'DM Mono', monospace; opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 100; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><span>3</span> Punts Monitor</div>
      <div class="subtitle">Panel de control · 3punts.com</div>
      <div class="nav-links">
        <a href="ventas_3punts.html" class="nav-link">Ventas totales por artista →</a>
        <a href="index.html" class="nav-link">← Artquemy</a>
        <a href="baseelements.html" class="nav-link">← Base Elements</a>
      </div>
      <div class="status-bar">
        <div class="status-dot loading" id="statusDot"></div>
        <span class="status-text" id="statusText">Cargando datos...</span>
        <button class="wake-btn" id="wakeBtn" onclick="despertarServicio()">⚡ Despertar servicio</button>
      </div>
      <div style="text-align:right;font-size:11px;color:var(--text-dim);margin-top:6px;" id="lastUpdateHeader">—</div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-label">Ventas del mes</div>
        <div class="card-value" id="totalMes">—</div>
        <div class="card-sub" id="obrasMes">Cargando...</div>
      </div>
      <div class="card">
        <div class="card-label">Obras vendidas este mes</div>
        <div class="card-value" id="numObras">—</div>
        <div class="card-sub" id="numObrasSub">Cargando...</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Historial mensual</div>
      <div id="historialContainer"><span class="loading-text">Cargando...</span></div>
    </div>

    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border);cursor:pointer;" onclick="toggleSection('vendidas')">
        <div class="section-title" style="border:none;padding:0;margin:0;" id="vendidasTitle">Obras vendidas</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:11px;color:var(--text-dim);" id="vendidasMeta"></span>
          <span style="font-size:20px;color:var(--text-dim);" id="vendidasArrow">▸</span>
        </div>
      </div>
      <div id="vendidasList" style="margin-top:12px;display:none;"><span class="loading-text">Cargando...</span></div>
    </div>

    <div class="section">
      <div class="section-title">Últimos cambios detectados</div>
      <div id="cambiosList"><span class="loading-text">Cargando...</span></div>
    </div>

    <div class="last-update" id="lastUpdate">—</div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const GITHUB_USER = 'apropdelalluna';
    const GITHUB_REPO = 'monitor-artquemy';
    const DEPLOY_HOOK = 'https://api.render.com/deploy/srv-d8a9ouml51nc73cit26g?key=rf4fW3ImMcw';

    const MESES_ES = { '01':'Enero','02':'Febrero','03':'Marzo','04':'Abril','05':'Mayo','06':'Junio','07':'Julio','08':'Agosto','09':'Septiembre','10':'Octubre','11':'Noviembre','12':'Diciembre' };
    const TIPO_LABEL = { 'vendida':'🔴 Vendida','nueva':'🟢 Nueva','nueva_vendida':'🔴🟢 Nueva vendida','precio_cambiado':'💰 Precio cambiado','desaparecida':'⚠️ Desaparecida' };

    let _historial = [];
    let _cambiosMostrados = 0;

    function formatNum(n) { return Number(n).toLocaleString('es-ES', {minimumFractionDigits:0,maximumFractionDigits:0}) + ' €'; }
    function formatMes(yyyymm) { const [y,m] = yyyymm.split('-'); return (MESES_ES[m]||m) + ' ' + y; }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

    async function fetchGitHub(file) {
      const r = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${file}`, { headers: { 'Accept': 'application/vnd.github.v3.raw' } });
      if (!r.ok) throw new Error('No encontrado: ' + file);
      return r.json();
    }

    function renderCambios(desde, hasta) {
      let html = '';
      let ultimo = desde;
      for (let i = desde; i < Math.min(hasta, _historial.length); i++) {
        const c = _historial[i];
        const tipo = c.tipo || 'desaparecida';
        ultimo = i + 1;
        const tipoLabel = TIPO_LABEL[tipo] || tipo;
        const precioAnterior = c.precio_anterior ? `<span style="color:var(--text-dim);text-decoration:line-through;margin-right:6px;">${c.precio_anterior}</span>` : '';
        html += `<div class="cambio-item ${tipo}">
          <div class="cambio-header">
            <div class="cambio-artista">${c.artista||''}</div>
            <div class="cambio-fecha">${c.fecha||''}</div>
          </div>
          <div class="cambio-obra">
            <span class="badge ${tipo}">${tipoLabel}</span>
            ${c.url ? `<a href="${c.url}" target="_blank" rel="noreferrer noopener" style="color:inherit;text-decoration:none;border-bottom:1px solid var(--border);">${c.titulo||c.obra||''}</a>` : (c.titulo||c.obra||'')}
          </div>
          ${c.precio && c.precio !== 'Precio no disponible' && c.precio !== 'Consultar precio' ? `<div class="cambio-precio">${precioAnterior}${c.precio}</div>` : ''}
        </div>`;
      }
      _cambiosMostrados = ultimo;
      return html;
    }

    function verMasCambios() {
      const boton = document.getElementById('verMasBtn');
      boton.insertAdjacentHTML('beforebegin', renderCambios(_cambiosMostrados, _cambiosMostrados + 20));
      const restantes = _historial.length - _cambiosMostrados;
      if (restantes <= 0) boton.style.display = 'none';
      else boton.textContent = `Ver más (${restantes} restantes)`;
    }

    async function cargarDatos() {
      try {
        const [ventas, historial, meta] = await Promise.all([
          fetchGitHub('ventas_mensuales_3punts.json'),
          fetchGitHub('historial_cambios_3punts.json'),
          fetchGitHub('meta_3punts.json'),
        ]);

        document.getElementById('lastUpdateHeader').textContent = `Última visita a 3 Punts: ${meta?.ultima_comprobacion || '—'}`;

        const ahora = new Date();
        const mesActual = `${ahora.getFullYear()}-${String(ahora.getMonth()+1).padStart(2,'0')}`;
        const ventasMes = ventas[mesActual] || [];
        const ventasReales = ventasMes.filter(v => (v.tipo === 'vendida' || v.tipo === 'nueva_vendida') && (v.precio_num||0) > 0);
        const totalMes = ventasReales.reduce((s,v) => s + (v.precio_num||0), 0);

        document.getElementById('totalMes').textContent = formatNum(totalMes);
        document.getElementById('obrasMes').textContent = `${ventasReales.length} obra${ventasReales.length!==1?'s':''} vendida${ventasReales.length!==1?'s':''} en ${formatMes(mesActual)}`;
        document.getElementById('numObras').textContent = ventasReales.length;
        document.getElementById('numObrasSub').textContent = formatMes(mesActual);

        // Historial mensual
        const meses = Object.keys(ventas).sort().reverse();
        let historialHTML = '';
        meses.forEach(mes => {
          const vs = ventas[mes].filter(v => (v.tipo === 'vendida' || v.tipo === 'nueva_vendida') && (v.precio_num||0) > 0);
          const total = vs.reduce((s,v) => s + (v.precio_num||0), 0);
          const esMesActual = mes === mesActual;
          historialHTML += `<div class="historial-mes">
            <div class="historial-mes-header">
              <div>
                <span style="font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;${esMesActual?'color:var(--new)':''}">${formatMes(mes)}</span>
                <span style="font-size:11px;color:var(--text-dim);margin-left:8px;">${vs.length} obra${vs.length!==1?'s':''}</span>
              </div>
              <span style="font-size:14px;font-weight:500;">${formatNum(total)}</span>
            </div>`;
          [...vs].reverse().forEach(v => {
            historialHTML += `<div class="historial-obra">
              <span style="color:var(--text-dim);">${v.url?`<a href="${v.url}" target="_blank" rel="noreferrer noopener" style="color:var(--text-dim);text-decoration:none;border-bottom:1px solid var(--border);">${v.obra}</a>`:v.obra} <span style="font-size:10px;opacity:0.6;">(${v.artista})</span></span>
              <span style="font-weight:500;">${v.precio_num?formatNum(v.precio_num):'—'}</span>
            </div>`;
          });
          historialHTML += '</div>';
        });
        document.getElementById('historialContainer').innerHTML = historialHTML || '<div class="empty">Sin datos</div>';

        // Obras vendidas
        document.getElementById('vendidasTitle').textContent = `Obras vendidas en ${formatMes(mesActual)}`;
        document.getElementById('vendidasMeta').textContent = `${ventasReales.length} obras · ${formatNum(totalMes)}`;
        if (ventasReales.length === 0) {
          document.getElementById('vendidasList').innerHTML = '<div class="empty">Sin obras vendidas este mes</div>';
        } else {
          let html = '';
          [...ventasReales].reverse().forEach(v => {
            html += `<div class="cambio-item vendida">
              <div class="cambio-header">
                <div class="cambio-artista">${v.artista||''}</div>
                <div class="cambio-fecha">${v.fecha||''}</div>
              </div>
              <div class="cambio-obra"><span class="badge vendida">🔴 Vendida</span>${v.url?`<a href="${v.url}" target="_blank" rel="noreferrer noopener" style="color:inherit;text-decoration:none;border-bottom:1px solid var(--border);">${v.obra}</a>`:v.obra}</div>
              ${v.precio_num?`<div class="cambio-precio">${formatNum(v.precio_num)}</div>`:''}
            </div>`;
          });
          document.getElementById('vendidasList').innerHTML = html;
        }

        // Últimos cambios
        _historial = [...historial].reverse();
        _cambiosMostrados = 0;
        if (_historial.length === 0) {
          document.getElementById('cambiosList').innerHTML = '<div class="empty">Sin cambios registrados aún</div>';
        } else {
          const htmlInicial = renderCambios(0, 20);
          const restantes = _historial.length - _cambiosMostrados;
          const boton = restantes > 0 ? `<button id="verMasBtn" onclick="verMasCambios()" style="width:100%;margin-top:12px;padding:10px;background:none;border:1px solid var(--border);color:var(--text-dim);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;">Ver más (${restantes} restantes)</button>` : '';
          document.getElementById('cambiosList').innerHTML = htmlInicial + boton;
        }

        document.getElementById('statusDot').className = 'status-dot';
        document.getElementById('statusText').textContent = `Datos actualizados · ${_historial.length} cambios registrados`;
        document.getElementById('lastUpdate').textContent = `Última actualización local: ${new Date().toLocaleString('es-ES')}`;

      } catch(e) {
        document.getElementById('statusDot').className = 'status-dot error';
        document.getElementById('statusText').textContent = 'Error al cargar datos';
        console.error(e);
      }
    }

    async function despertarServicio() {
      const btn = document.getElementById('wakeBtn');
      btn.disabled = true;
      document.getElementById('statusDot').className = 'status-dot loading';
      try {
        await fetch(DEPLOY_HOOK, { method: 'POST', mode: 'no-cors' });
        showToast('✅ Servicio despertado. Actualizando en ~7 min.');
        let restantes = 7 * 60;
        const intervalo = setInterval(() => {
          restantes--;
          const min = Math.floor(restantes / 60);
          const seg = restantes % 60;
          btn.textContent = `⏳ ${min}:${String(seg).padStart(2,'0')} para actualizar`;
          if (restantes <= 0) {
            clearInterval(intervalo);
            btn.textContent = '🔄 Actualizando...';
            cargarDatos().then(() => {
              btn.disabled = false;
              btn.textContent = '⚡ Despertar servicio';
              document.getElementById('statusDot').className = 'status-dot';
            });
          }
        }, 1000);
      } catch(e) {
        showToast('❌ Error al despertar el servicio');
        btn.disabled = false;
        btn.textContent = '⚡ Despertar servicio';
        document.getElementById('statusDot').className = 'status-dot error';
      }
    }

    function toggleSection(id) {
      const content = document.getElementById(id + 'List');
      const arrow = document.getElementById(id + 'Arrow');
      const isOpen = content.style.display !== 'none';
      content.style.display = isOpen ? 'none' : 'block';
      arrow.textContent = isOpen ? '▸' : '▾';
    }

    cargarDatos();
  </script>
</body>
</html>
